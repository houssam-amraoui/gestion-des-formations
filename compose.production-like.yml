services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    build: .
    entrypoint: ["dotnet", "/app/migrations/TrainingManagement.Migrations.dll"]
    environment: &app-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQLSERVER_DATABASE:-TrainingManagement};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Application__Name: Training Management
      Application__PublicBaseUrl: "https://localhost:${APP_PORT:-8080}"
      CertificateStorage__Provider: Local
      CertificateStorage__BasePath: /app/data/certificates
      DataProtection__KeysPath: /app/data/keys
      DataProtection__ApplicationName: TrainingManagement
      SeedAdmin__Enabled: "false"
      AiTrainer__Enabled: "false"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    environment:
      <<: *app-environment
      PORT: "8080"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "dotnet", "TrainingManagement.Web.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
  app-data:
